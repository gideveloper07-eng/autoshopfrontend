# JVM heap sized for a 7GB RAM machine (i3-7100T)
# -Xmx2G leaves enough RAM for Windows + the build tools running alongside Gradle
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use parallel builds but cap workers so RAM isn't exhausted
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true

# Keep daemon off — avoids leftover daemon eating RAM between builds
org.gradle.daemon=false

android.useAndroidX=true

# Built-in Kotlin support (suppresses the KGP warnings)
android.builtInKotlin=true
android.newDsl=true

# Kotlin incremental off saves memory
kotlin.incremental=false
